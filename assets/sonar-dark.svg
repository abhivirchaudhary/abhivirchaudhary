<style>.sweep{transform-origin:214px 208px;animation:spin 8s linear infinite}
.ping{transform-box:fill-box;transform-origin:center;opacity:0;animation:ping 8s linear infinite}
.blip{animation:fade 8s linear infinite}
.breathe{animation:br 4s ease-in-out infinite}
.bar{animation:br 6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(.3);opacity:.8}20%{transform:scale(1.7);opacity:0}100%{transform:scale(1.7);opacity:0}}
@keyframes fade{0%{opacity:1}100%{opacity:.4}}
@keyframes br{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.sweep,.ping,.blip,.breathe,.bar{animation:none}}</style>
